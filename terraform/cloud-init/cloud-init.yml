#cloud-config

package_update: true
packages:
  - gnupg2
  - pass
  - gdb 


runcmd:
  - sleep 30
  - cd ~
  - wget --no-check-certificate -c https://github.com/fatedier/frp/releases/download/v0.58.0/frp_0.58.0_linux_amd64.tar.gz
  - tar zxvf frp_0.58.0_linux_amd64.tar.gz
  - cd frp_0.58.0_linux_amd64
  - cp frps /usr/bin
  - mkdir -p /etc/frp
  - cp /home/frps/frps.ini /etc/frp
  - cp /home/frps/frps.service /etc/systemd/system
  - systemctl enable --now frps
  - apt install nginx
  - cp /home/frps/nginx /etc/nginx/sites-available/default